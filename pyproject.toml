[project]
name = "Lockstep"
version = "0.1.0"
dependencies = [
    "antlr4-python3-runtime>=4.13,<4.14",
    "llvmlite>=0.43,<0.44",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "mypy",
    "hypothesis",
]
lsp = [
    "pygls",
    "lsprotocol",
]

[project.scripts]
lockstepc = "lockstep_compiler.cli:main"
lockstep-lsp = "lockstep_compiler.lsp:run_lsp_server"

[tool.pytest.ini_options]
addopts = "-q -ra"
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py311"]
include = "\\.pyi?$"

[tool.coverage.run]
branch = true
source = ["."]
omit = [
    "tests/*",
    "generated/parser/LockstepLexer.py",
    "generated/parser/LockstepListener.py",
    "generated/parser/LockstepParser.py",
    "generated/parser/LockstepVisitor.py",
]

[tool.coverage.report]
show_missing = true

[tool.mypy]
strict = true
files = [
    "lockstep_compiler/models.py",
    "lockstep_compiler/utils.py",
]
ignore_missing_imports = true
follow_imports = "skip"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["debug_compiler"]
packages = ["lockstep_compiler", "generated", "generated.parser"]

[tool.setuptools.package-data]
lockstep_compiler = ["prelude.lock"]
