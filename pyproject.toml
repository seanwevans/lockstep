[project]
name = "Lockstep"
version = "0.1.0"
dependencies = [
    "antlr4-python3-runtime>=4.13,<4.14",
    "llvmlite>=0.43,<0.44",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "pytest-benchmark",
    "mypy",
    "hypothesis",
    # The lockfiles are generated on a single interpreter/platform, but the
    # test matrix spans Windows and Python 3.10-3.12. Declare the environment
    # specific transitive dependencies explicitly so they are always pinned
    # (with hashes) in the lockfile and ``pip install --require-hashes``
    # succeeds on every matrix entry. pytest pulls colorama in on Windows and
    # tomli/exceptiongroup in on Python < 3.11.
    "colorama; sys_platform == 'win32'",
    "tomli; python_version < '3.11'",
    "exceptiongroup; python_version < '3.11'",
]
lsp = [
    "pygls",
    "lsprotocol",
]

[project.scripts]
lockstepc = "lockstep_compiler.cli:main"
lockstep-lsp = "lockstep_compiler.lsp:run_lsp_server"

[tool.pytest.ini_options]
addopts = "-q -ra"
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py311"]
include = "\\.pyi?$"
extend-exclude = "generated/"

[tool.coverage.run]
branch = true
source = ["."]
omit = [
    "tests/*",
    "generated/parser/LockstepLexer.py",
    "generated/parser/LockstepListener.py",
    "generated/parser/LockstepParser.py",
    "generated/parser/LockstepVisitor.py",
]

[tool.coverage.report]
show_missing = true

[tool.mypy]
strict = true
files = [
    "lockstep_compiler/cli.py",
    "lockstep_compiler/compiler.py",
    "lockstep_compiler/lsp.py",
    "lockstep_compiler/models.py",
    "lockstep_compiler/simulator.py",
    "lockstep_compiler/utils.py",
]
ignore_missing_imports = true
follow_imports = "skip"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lockstep_compiler", "generated", "generated.parser"]

[tool.setuptools.package-data]
lockstep_compiler = ["prelude.lock"]
