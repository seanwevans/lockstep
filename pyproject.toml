[project]
name = "Lockstep"
version = "0.1.0"
dependencies = [
    "antlr4-python3-runtime",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
]

[project.scripts]
lockstepc = "lockstep_compiler.cli:main"

[tool.pytest.ini_options]
addopts = "-q -ra --cov=. --cov-branch --cov-report=term-missing --cov-report=xml:coverage.xml"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["."]
omit = [
    "tests/*",
    "generated/parser/LockstepLexer.py",
    "generated/parser/LockstepListener.py",
    "generated/parser/LockstepParser.py",
    "generated/parser/LockstepVisitor.py",
]

[tool.coverage.report]
show_missing = true

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["debug_compiler"]
packages = ["lockstep_compiler"]
