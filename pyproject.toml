[project]
name = "Lockstep"
version = "0.1.0"
dependencies = [
    "antlr4-python3-runtime",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
]

[tool.pytest.ini_options]
addopts = "-q -ra --cov=. --cov-branch --cov-report=term-missing --cov-report=xml:coverage.xml"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["."]
omit = [
    "tests/*",
    "LockstepLexer.py",
    "LockstepListener.py",
    "LockstepParser.py",
    "LockstepVisitor.py",
]

[tool.coverage.report]
show_missing = true

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["debug_compiler"]
packages = ["lockstep_compiler"]
