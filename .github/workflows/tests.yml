name: CI

on:
    push:
        branches: ["**"]
    pull_request:
    workflow_dispatch:
    schedule:
        # Weekly every Monday @ 06:19 UTC
        - cron: "19 6 * * 1"

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    
jobs:
    parser-generation:
        name: Parser generation is up to date
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
          - name: Checkout
            uses: actions/checkout@v4

          - name: Setup Python
            uses: actions/setup-python@v5
            with:
              python-version: "3.12"

          - name: Check generated parser files
            run: |
              make check-generated-parser


    lint:
        name: Static checks
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
          - name: Checkout
            uses: actions/checkout@v4

          - name: Setup Python
            uses: actions/setup-python@v5
            with:
              python-version: "3.12"

          - name: Verify Python modules compile
            run: |
              python -m compileall debug_compiler.py lockstep_compiler tests

    test:
        name: Tests (${{ matrix.os }} / py${{ matrix.python-version }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
                python-version: ["3.10", "3.11", "3.12"]
            
        steps:
          - name: Checkout
            uses: actions/checkout@v4

          - name: Setup Python
            uses: actions/setup-python@v5
            with:
              python-version: ${{ matrix.python-version }}
              cache: "pip"
              
          - name: Install dependencies
            run: |
              python -m pip install --upgrade pip
              pip install ".[test]"

          - name: Run unit tests with coverage
            run: |
              python -m pytest --junitxml=pytest-junit.xml

          - name: Upload coverage artifacts
            if: always()
            uses: actions/upload-artifact@v4
            with:
                name: reports-${{ matrix.os }}-py${{ matrix.python-version }}
                path: |
                    coverage.xml
                    pytest-junit.xml
                if-no-files-found: warn
