name: CI

on:
    push:
        branches: ["**"]
    pull_request:
    workflow_dispatch:
    schedule:
        # Weekly every Monday @ 06:19 UTC
        - cron: "19 6 * * 1"

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    
jobs:
    dependency-lockfiles:
        name: Dependency lockfiles are up to date
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
          - name: Checkout
            uses: actions/checkout@v5

          - name: Setup Python
            uses: actions/setup-python@v6
            with:
              python-version: "3.12"

          - name: Install pip-tools
            run: |
              # pip 26.2 removed pip._internal.utils.compat.stdlib_pkgs, which
              # pip-tools still imports, so pin pip below that. Pin pip-tools to
              # the version the committed lockfiles were generated with so the
              # regenerated output matches byte-for-byte.
              python -m pip install "pip==26.1"
              python -m pip install "pip-tools==7.6.0"

          - name: Check dependency lockfiles
            run: |
              make check-lock-deps

    parser-generation:
        name: Parser generation is up to date
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
          - name: Checkout
            uses: actions/checkout@v5

          - name: Setup Python
            uses: actions/setup-python@v6
            with:
              python-version: "3.12"

          - name: Check generated parser files
            run: |
              make check-generated-parser


    lint:
        name: Static checks
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
          - name: Checkout
            uses: actions/checkout@v5

          - name: Setup Python
            uses: actions/setup-python@v6
            with:
              python-version: "3.12"

          - name: Verify Python modules compile
            run: |
              python -m compileall debug_compiler.py lockstep_compiler tests

    typecheck:
        name: Type checks (mypy)
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
          - name: Checkout
            uses: actions/checkout@v5

          - name: Setup Python
            uses: actions/setup-python@v6
            with:
              python-version: "3.12"
              cache: "pip"

          - name: Install dependencies
            run: |
              python -m pip install --upgrade pip
              python -m pip install --require-hashes -r requirements-test.lock

          - name: Run mypy
            run: |
              make mypy

    test:
        name: Tests (${{ matrix.os }} / py${{ matrix.python-version }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
                python-version: ["3.10", "3.11", "3.12"]
            
        steps:
          - name: Checkout
            uses: actions/checkout@v5

          - name: Setup Python
            uses: actions/setup-python@v6
            with:
              python-version: ${{ matrix.python-version }}
              cache: "pip"
              
          - name: Install dependencies
            run: |
              python -m pip install --upgrade pip
              python -m pip install --require-hashes -r requirements-test.lock

          - name: Run unit tests with coverage
            run: |
              python -m pytest --junitxml=pytest-junit.xml

          - name: Upload coverage artifacts
            if: always()
            uses: actions/upload-artifact@v6
            with:
                name: reports-${{ matrix.os }}-py${{ matrix.python-version }}
                path: |
                    coverage.xml
                    pytest-junit.xml
                if-no-files-found: warn


    benchmark:
        name: Benchmarks (advisory)
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
          - name: Checkout
            uses: actions/checkout@v5

          - name: Setup Python
            uses: actions/setup-python@v6
            with:
              python-version: "3.12"
              cache: "pip"

          - name: Install dependencies
            run: |
              python -m pip install --upgrade pip
              python -m pip install --require-hashes -r requirements-test.lock

          - name: Run benchmarks
            run: |
              make bench

          - name: Upload benchmark JSON
            if: always()
            uses: actions/upload-artifact@v6
            with:
                name: benchmark-results-pr-${{ github.run_id }}
                path: benchmark-results.json
                if-no-files-found: error

          - name: Check benchmark regression (advisory)
            id: benchmark_regression
            continue-on-error: true
            run: |
              make bench-check

          - name: Benchmark regression advisory
            if: steps.benchmark_regression.outcome == 'failure'
            run: |
              echo "::warning::Benchmark regression threshold exceeded (advisory mode)."
